media:
  input: public/media
  output: /media

content:
  - name: posts
    label: المقالات والأدلة
    type: collection
    path: content/posts
    filename:
      template: "{primary}.md"
      field: create
    format: yaml-frontmatter
    view:
      fields: [title, category, verificationStatus, updatedDate, draft]
      primary: title
      sort: [updatedDate, publishDate]
      default:
        sort: updatedDate
        order: desc
    fields:
      - { name: title, label: العنوان, type: string, required: true }
      - { name: description, label: وصف SEO, type: text, required: true }
      - name: category
        label: القسم
        type: select
        options:
          values:
            - { value: satellites, label: الأقمار والاستقبال }
            - { value: channels, label: القنوات والترددات }
            - { value: receivers, label: أجهزة الاستقبال }
            - { value: streaming, label: المشاهدة الذكية }
      - { name: tags, label: الوسوم, type: string, list: true }
      - name: authorSlug
        label: الكاتب
        type: select
        options:
          values:
            - { value: mostafa-ghanem, label: مصطفى غانم }
            - { value: gamal-abdelaziz, label: جمال عبد العزيز }
      - name: reviewerSlug
        label: المراجع
        type: select
        options:
          values:
            - { value: mostafa-ghanem, label: مصطفى غانم }
            - { value: gamal-abdelaziz, label: جمال عبد العزيز }
      - { name: publishDate, label: تاريخ النشر, type: date, required: true }
      - { name: updatedDate, label: تاريخ التحديث, type: date }
      - { name: lastVerifiedDate, label: آخر تحقق عملي, type: date }
      - name: verificationStatus
        label: حالة التحقق
        type: select
        options:
          values:
            - { value: verified, label: تم التحقق }
            - { value: evergreen, label: محتوى إرشادي ثابت }
            - { value: pending, label: بانتظار تحقق ميداني }
      - { name: featured, label: مميز في الرئيسية, type: boolean, default: false }
      - { name: pinned, label: مثبت, type: boolean, default: false }
      - { name: affiliate, label: يتضمن أفلييت, type: boolean, default: false }
      - { name: draft, label: مسودة, type: boolean, default: true }
      - name: sources
        label: المصادر
        type: object
        list: true
        fields:
          - { name: title, label: اسم المصدر, type: string }
          - { name: url, label: رابط المصدر, type: string }
      - { name: body, label: نص المقال, type: rich-text }

settings:
  content:
    merge: direct
