media:
  input: public/media
  output: /media

content:
  - name: posts
    label: المقالات والأدلة
    type: collection
    path: content/posts
    filename:
      template: "{primary}.md"
      field: create
    format: yaml-frontmatter
    view:
      fields: [title, category, verificationStatus, updatedDate, draft]
      primary: title
      sort: [updatedDate, publishDate]
      default:
        sort: updatedDate
        order: desc
    fields:
      - { name: title, label: العنوان, type: string, required: true }
      - { name: description, label: وصف SEO, type: text, required: true }
      - name: category
        label: القسم
        type: select
        options:
          values:
            - { name: satellites, label: الأقمار والاستقبال }
            - { name: channels, label: القنوات والترددات }
            - { name: receivers, label: أجهزة الاستقبال }
            - { name: streaming, label: المشاهدة الذكية }
      - { name: tags, label: الوسوم, type: string, list: true }
      - name: authorSlug
        label: الكاتب
        type: select
        options:
          values:
            - { name: mostafa-ghanem, label: مصطفى غانم }
            - { name: gamal-abdelaziz, label: جمال عبد العزيز }
      - name: reviewerSlug
        label: المراجع
        type: select
        options:
          values:
            - { name: mostafa-ghanem, label: مصطفى غانم }
            - { name: gamal-abdelaziz, label: جمال عبد العزيز }
      - name: publishDate
        label: تاريخ النشر
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: updatedDate
        label: تاريخ التحديث
        type: date
        default: ""
        options:
          format: yyyy-MM-dd
      - name: lastVerifiedDate
        label: آخر تحقق عملي
        type: date
        default: ""
        options:
          format: yyyy-MM-dd
      - name: verificationStatus
        label: حالة التحقق
        type: select
        options:
          values:
            - { name: verified, label: تم التحقق }
            - { name: evergreen, label: محتوى إرشادي ثابت }
            - { name: pending, label: بانتظار تحقق ميداني }
      - { name: featured, label: مميز في الرئيسية, type: boolean, default: false }
      - { name: pinned, label: مثبت, type: boolean, default: false }
      - { name: affiliate, label: يتضمن أفلييت, type: boolean, default: false }
      - { name: draft, label: مسودة, type: boolean, default: true }
      - name: sources
        label: المصادر
        type: object
        list: true
        fields:
          - { name: title, label: اسم المصدر, type: string }
          - { name: url, label: رابط المصدر, type: string }
      - name: city
        label: المدينة المستهدفة (لطلب الفني)
        type: select
        options:
          values:
            - { name: riyadh, label: الرياض }
            - { name: jeddah, label: جدة }
            - { name: makkah, label: مكة المكرمة }
            - { name: madinah, label: المدينة المنورة }
            - { name: dammam, label: الدمام }
            - { name: khobar, label: الخبر }
            - { name: qassim, label: القصيم }
            - { name: abha, label: أبها وخميس مشيط }
            - { name: tabuk, label: تبوك }
            - { name: hail, label: حائل }
            - { name: other, label: مدينة أخرى }
      - { name: leadCta, label: إظهار طلب فني (يُترك فارغًا للافتراضي حسب القسم), type: boolean }
      - name: products
        label: منتجات مقترحة (حتى 3)
        type: object
        list: { max: 3 }
        fields:
          - { name: name, label: اسم المنتج, type: string }
          - { name: note, label: لماذا نرشحه (سطر واحد), type: string }
          - { name: url, label: رابط الأفلييت, type: string }
          - name: store
            label: المتجر
            type: select
            default: amazon
            options:
              values:
                - { name: amazon, label: أمازون السعودية }
                - { name: noon, label: نون }
                - { name: jarir, label: جرير }
                - { name: extra, label: إكسترا }
                - { name: other, label: أخرى }
      - name: body
        label: نص المقال
        type: rich-text
        options:
          format: markdown
          media: false
          switcher: true

settings:
  content:
    merge: true
  commit:
    identity: user
    templates:
      create: "content(create): {path}"
      update: "content(update): {path}"
      delete: "content(delete): {path}"
      rename: "content(rename): {oldPath} -> {newPath}"
